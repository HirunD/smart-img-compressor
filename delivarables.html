<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Bamba Asset Manager</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .external-link { margin-bottom: 20px; display: block; color: var(--primary); text-decoration: none; font-weight: 500; }
        .asset-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .asset-row:last-child { border-bottom: none; }
        .label { font-weight: 600; min-width: 120px; font-size: 0.85rem; color: #64748b; text-transform: uppercase; }
        input[type="text"] {
            flex-grow: 1;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        input[type="text"]:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        .save-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>La Bamba Asset Manager</h1>
    <a href="https://docs.google.com/spreadsheets/d/1Oa3WjZpW2P5p-tUhuyMemDMBe7kuSZC_SPtaB1av2TE/edit?usp=drive_web" target="_blank" class="external-link">
        🔗 Open Asset Inventory Google Sheet
    </a>

    <div id="asset-list">
        <!-- Rows will be injected here -->
    </div>

    <button class="save-btn" onclick="saveChanges()">Save Metadata</button>
</div>

<script>
    // Initial data pulled from your inventory
    const assets = [
        { category: "Video", name: "Social Media Trailer 2 (v1 & v2)", format: "MP4" },
        { category: "Video", name: "Trailer Ad (Vertical & Landscape)", format: "MP4" },
        { category: "Design", name: "School Poster PRINT (V8, V9)", format: "PDF" },
        { category: "Design", name: "X Banner (CMYK & RGB)", format: "PDF" },
        { category: "Social", name: "Instagram Carousel (1-17)", format: "PNG" }
    ];

    function renderAssets() {
        const list = document.getElementById('asset-list');
        list.innerHTML = assets.map((asset, index) => `
            <div class="asset-row">
                <span class="label">${asset.category}</span>
                <input type="text" value="${asset.name}" id="input-${index}" placeholder="Edit file name...">
                <span class="label" style="min-width: 50px;">${asset.format}</span>
            </div>
        `).join('');
    }

    function saveChanges() {
        assets.forEach((asset, index) => {
            const newValue = document.getElementById(`input-${index}`).value;
            asset.name = newValue;
        });
        console.log("Updated Assets:", assets);
        alert("Names updated in local state! (Check console for output)");
    }

    renderAssets();
</script>

</body>
</html>
