<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mimic | Conflict Resolver</title>
    <style>
        :root { --bg: #0f1113; --accent: #00f2ff; --text: #f5f5f5; --border: #2d3339; --card: #16191c; --error: #ff4d4d; --success: #34A853; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin:0; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        textarea { 
            width: 100%; height: 160px; background: #0a0c0e; border: 1px solid var(--border); 
            color: var(--accent); padding: 12px; border-radius: 8px; font-size: 11px; outline: none;
        }

        .controls { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .search-box { 
            width: 100%; padding: 12px; background: #000; border: 1px solid var(--accent); 
            color: #fff; border-radius: 6px; margin-top: 10px; box-sizing: border-box; outline: none;
        }

        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-main { background: var(--accent); color: #000; }
        .btn-export { background: var(--success); color: #fff; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background: #1a1d21; color: var(--accent); font-size: 0.7rem; text-transform: uppercase; }

        /* Conflict Styling */
        .conflict-row { background: rgba(255, 77, 77, 0.08); }
        .conflict-select { border: 2px solid var(--error) !important; color: var(--error) !important; font-weight: bold; }
        .choice-chip { background: #ff4d4d22; color: var(--error); border: 1px solid var(--error); padding: 2px 5px; border-radius: 4px; font-size: 9px; margin-right: 4px; }
        
        .match-select {
            background: #0a0c0e; color: #ffca00; border: 1px solid #444;
            padding: 8px; border-radius: 4px; width: 100%; max-width: 350px; font-size: 12px;
        }

        .folder-name { font-size: 13px; font-weight: 500; }
        .conflict-summary { font-size: 10px; color: var(--error); margin-top: 5px; display: block; font-weight: bold; }
        
        .tag-auto { background: #1b4d3e; color: #a3ffda; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 8px; }
        .btn-delete { color: #666; background: none; border: 1px solid #444; padding: 4px 8px; font-size: 10px; cursor: pointer; }
        .btn-delete:hover { border-color: var(--error); color: var(--error); }
    </style>
</head>
<body>

<div class="container">
    <div class="grid">
        <div>
            <label>1. Drive JSON (@karancooks Folders)</label>
            <textarea id="driveInput" placeholder="Paste JSON..."></textarea>
        </div>
        <div>
            <label>2. Recipe Names List</label>
            <textarea id="recipeInput" placeholder="Paste Recipe Names..."></textarea>
        </div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="btn-main" onclick="processData()">🚀 Filter & Resolve Conflicts</button>
            <button class="btn-export" onclick="exportData()">📥 Export CSV</button>
        </div>
        <input type="text" id="tableSearch" class="search-box" placeholder="Search by folder or recipe name...">
    </div>

    <table id="matchTable">
        <thead>
            <tr>
                <th>Drive Folder</th>
                <th>Matched / Conflict Choices</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="matchBody"></tbody>
    </table>
</div>

<script>
    let currentRecipes = [];

    function processData() {
        const driveRaw = document.getElementById('driveInput').value;
        const recipeRaw = document.getElementById('recipeInput').value;
        const tbody = document.getElementById('matchBody');
        tbody.innerHTML = '';

        try {
            const allData = JSON.parse(driveRaw);
            const driveResults = allData.filter(f => f.name.toLowerCase().startsWith('@karancooks'));
            currentRecipes = recipeRaw.split('\n').map(r => r.trim()).filter(r => r.length > 0);

            driveResults.forEach((folder, index) => {
                const cleanFolder = folder.name.replace(/@karancooks\s*-\s*/gi, '').toLowerCase().trim();
                const folderWords = cleanFolder.split(/\s+/).filter(w => w.length > 2);
                
                // Find all potential matches
                const matches = currentRecipes.filter(recipe => {
                    const r = recipe.toLowerCase();
                    return folderWords.some(word => r.includes(word)) || r.includes(cleanFolder);
                });

                const isConflict = matches.length > 1;
                const bestMatch = matches.length > 0 ? matches[0] : null;

                // Sort Dropdown: Put matches at the top, then everything else
                let topOptions = matches.map(m => `<option value="${m}" ${m === bestMatch ? 'selected' : ''}>⭐ MATCH: ${m}</option>`).join('');
                let otherOptions = currentRecipes.filter(r => !matches.includes(r))
                                                 .map(r => `<option value="${r}">${r}</option>`).join('');

                const row = document.createElement('tr');
                row.id = `row-${index}`;
                if (isConflict) row.className = 'conflict-row';
                
                row.innerHTML = `
                    <td class="folder-name">
                        ${folder.name}
                        ${bestMatch && !isConflict ? '<span class="tag-auto">AUTO</span>' : ''}
                        ${isConflict ? `<span class="conflict-summary">⚠️ CONFLICT: Found ${matches.length} matches</span>` : ''}
                    </td>
                    <td>
                        <select class="match-select ${isConflict ? 'conflict-select' : ''}" id="select-${index}">
                            <option value="">-- No Match Selected --</option>
                            ${topOptions}
                            <hr>
                            ${otherOptions}
                        </select>
                    </td>
                    <td>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <a href="${folder.link}" target="_blank" style="color:var(--accent); text-decoration:none; font-size:12px; font-weight:bold;">FOLDER</a>
                            <button class="btn-delete" onclick="document.getElementById('row-${index}').remove()">Delete</button>
                        </div>
                    </td>`;
                tbody.appendChild(row);
            });
        } catch (e) { alert("Check Box 1 for valid JSON."); }
    }

    function exportData() {
        const rows = document.querySelectorAll('#matchBody tr');
        let csvContent = "data:text/csv;charset=utf-8,Folder,Match,Link\n";
        rows.forEach(row => {
            const folder = row.querySelector('.folder-name').childNodes[0].textContent.trim();
            const sel = row.querySelector('select');
            const match = sel.options[sel.selectedIndex].value;
            const link = row.querySelector('a').href;
            csvContent += `"${folder}","${match}","${link}"\n`;
        });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", "recipe_matches.csv");
        document.body.appendChild(link);
        link.click();
    }

    document.getElementById('tableSearch').addEventListener('keyup', function() {
        const val = this.value.toUpperCase();
        document.querySelectorAll('#matchBody tr').forEach(tr => {
            tr.style.display = tr.innerText.toUpperCase().includes(val) ? '' : 'none';
        });
    });
</script>

</body>
</html>
